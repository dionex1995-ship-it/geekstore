<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — GEEKSTORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo">GEEK<span>STORE</span></a>
      <nav class="nav-links">
        <a href="index.html">К магазину</a>
        <a href="#">Выход</a>
      </nav>
    </div>
  </header>
  <div class="admin-page">
    <div class="container">
      <div class="admin-header">
        <h1>Админ-панель</h1>
        <button class="btn btn-primary" id="openAddForm">+ Добавить товар</button>
      </div>
      <div class="admin-toolbar">
        <input type="text" id="adminSearch" placeholder="Поиск товаров...">
        <select id="adminCategoryFilter">
          <option value="">Все категории</option>
        </select>
      </div>
      <div class="admin-table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Фото</th>
              <th>Название</th>
              <th>Бренд</th>
              <th>Категория</th>
              <th>Цена</th>
              <th>Остаток</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="adminTableBody">
          </tbody>
        </table>
      </div>
      <div class="admin-form" id="adminForm" style="display:none;">
        <h2>Редактирование товара</h2>
        <form id="productForm">
          <input type="hidden" id="productId">
          <div class="form-row">
            <div class="form-group">
              <label>Название</label>
              <input type="text" id="editTitle" required>
            </div>
            <div class="form-group">
              <label>Бренд</label>
              <input type="text" id="editBrand" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Категория</label>
              <select id="editCategory" required>
                <option value="smartphones">Смартфоны</option>
                <option value="laptops">Ноутбуки</option>
                <option value="tablets">Планшеты</option>
                <option value="headphones">Наушники</option>
                <option value="accessories">Аксессуары</option>
              </select>
            </div>
            <div class="form-group">
              <label>Цена (₽)</label>
              <input type="number" id="editPrice" min="0" required>
            </div>
            <div class="form-group">
              <label>Старая цена (₽)</label>
              <input type="number" id="editOldPrice" min="0">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Остаток</label>
              <input type="number" id="editStock" min="0" required>
            </div>
            <div class="form-group">
              <label>Рейтинг</label>
              <input type="number" id="editRating" min="0" max="5" step="0.1" value="4.5">
            </div>
          </div>
          <div class="form-group">
            <label>Описание</label>
            <textarea id="editDescription" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label>Изображение (URL)</label>
            <input type="text" id="editImage" placeholder="https://example.com/image.jpg">
          </div>
          <div class="form-group form-group-full">
            <label>Характеристики (JSON)</label>
            <textarea id="editSpecs" rows="4" class="specs-json">{"Экран": "6.1 дюйма"}</textarea>
          </div>
          <div style="display:flex; gap:12px;">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <button type="button" class="btn btn-outline" id="cancelEdit">Отмена</button>
            <button type="button" class="btn btn-danger" id="deleteProduct" style="display:none;">Удалить</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; 2024 GEEKSTORE. Админ-панель.
      </div>
    </div>
  </footer>
  <div class="toast-container" id="toastContainer"></div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
